[package]
name = "biblion"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "High-performance MCP server that gives LLMs sub-millisecond access to your Zotero library"
license = "MIT"
repository = "https://github.com/eserie/biblion"
readme = "../../README.md"
keywords = ["zotero", "mcp", "model-context-protocol", "sqlite", "bibliography"]
categories = ["command-line-utilities", "database"]
authors = ["Emmanuel Serie <emmanuel@biblion.dev>"]

[dependencies]
paper-resolver = { version = "0.1.0", path = "../paper-resolver" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros"] }
dotenvy = "0.15"
toml = "0.8"
regex = "1"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"

[dev-dependencies]
wiremock = "0.6"

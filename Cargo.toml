[package]
name = "zotero-mcp"
version = "0.1.0"
edition = "2024"
description = "High-performance MCP server that gives LLMs sub-millisecond access to your Zotero library"
license = "MIT"
repository = "https://github.com/eserie/zotero-mcp-rs"
readme = "README.md"
keywords = ["zotero", "mcp", "model-context-protocol", "sqlite", "bibliography"]
categories = ["command-line-utilities", "database"]
authors = ["Emmanuel Serie <emmanuel@epinoia.io>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros"] }
dotenvy = "0.15"
regex = "1"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

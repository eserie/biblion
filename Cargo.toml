[package]
name = "zotero-mcp"
version = "0.1.0"
edition = "2024"
description = "High-performance Zotero MCP server — direct SQLite access, sub-millisecond reads"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["rt", "macros"] }
dotenvy = "0.15"
regex = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
